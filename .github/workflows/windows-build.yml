name: Windows build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning'
      - name: Rust format and tests
        shell: pwsh
        run: |
          cargo fmt --all
          cargo test
          cargo build --release
      - name: Configure Qt GUI
        shell: pwsh
        run: |
          $qmake = (Get-Command qmake -ErrorAction Stop).Source
          $qtRoot = Split-Path (Split-Path $qmake -Parent) -Parent
          cmake -S gui -B build/gui -DCMAKE_PREFIX_PATH="$qtRoot" -DCMAKE_BUILD_TYPE=Release
      - name: Build Qt GUI
        run: cmake --build build/gui --config Release
      - name: Package Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = Join-Path $PWD "dist/proton-vpn-client"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null

          $rustExe = Join-Path $PWD "target/release/proton-vpn-client.exe"
          $guiCandidates = @(
            (Join-Path $PWD "build/gui/Release/proton-vpn-gui.exe"),
            (Join-Path $PWD "build/gui/proton-vpn-gui.exe")
          )
          $guiExe = $guiCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not (Test-Path $rustExe)) { throw "Rust supervisor executable missing: $rustExe" }
          if (-not $guiExe) { throw "Qt GUI executable missing from build/gui." }

          Copy-Item $rustExe (Join-Path $packageRoot "proton-vpn-client.exe") -Force
          $stagedGui = Join-Path $packageRoot "proton-vpn-gui.exe"
          Copy-Item $guiExe $stagedGui -Force
          Copy-Item (Join-Path $PWD "README.md") (Join-Path $packageRoot "README.md") -Force

          $wintunZip = Join-Path $env:RUNNER_TEMP "wintun-0.14.1.zip"
          $wintunRoot = Join-Path $env:RUNNER_TEMP "wintun-0.14.1"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $wintunZip
          $wintunHash = (Get-FileHash -Path $wintunZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($wintunHash -ne "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51") {
            throw "Wintun archive SHA-256 mismatch: $wintunHash"
          }
          Expand-Archive -LiteralPath $wintunZip -DestinationPath $wintunRoot -Force
          $wintunDll = Join-Path $wintunRoot "wintun/bin/amd64/wintun.dll"
          $wintunLicense = Join-Path $wintunRoot "wintun/LICENSE.txt"
          if (-not (Test-Path $wintunDll)) { throw "The verified Wintun archive did not contain the AMD64 DLL." }
          if (-not (Test-Path $wintunLicense)) { throw "Wintun redistribution license missing from the verified archive." }
          Copy-Item $wintunDll (Join-Path $packageRoot "wintun.dll") -Force
          Copy-Item $wintunLicense (Join-Path $packageRoot "WINTUN-LICENSE.txt") -Force

          $qmake = (Get-Command qmake -ErrorAction Stop).Source
          $qtBin = Split-Path $qmake -Parent
          $winDeployQt = Join-Path $qtBin "windeployqt.exe"
          if (-not (Test-Path $winDeployQt)) { throw "windeployqt.exe not found: $winDeployQt" }

          & $winDeployQt --release --compiler-runtime --no-translations --dir $packageRoot $stagedGui
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-vpn-client-windows-x64
          path: dist/proton-vpn-client/
          if-no-files-found: error
          retention-days: 14
